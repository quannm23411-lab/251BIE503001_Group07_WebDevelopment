<header class="header">
  <div class="header__main container-fluid px-4">
    <!-- LOGO -->
    <div class="header__logo">
      <img src="../../assets/logos/logo.png" alt="EcoMOVE Logo" />
      <span class="header__logo-text">EcoMOVE</span>
    </div>

    <!-- SEARCH BAR -->
    <form class="header__search">
      <input type="text" class="header__search-input" placeholder="Bạn muốn thuê gì hôm nay?" />
      <button type="submit" class="header__search-btn">
        <img src="../../assets/icons/search.png" alt="Tìm kiếm" />
      </button>
    </form>

    <!-- MARQUEE (QUẢNG CÁO) -->
    <div class="header__ads">
      <p class="header__ads-text">
        🌿 Miễn phí giao/nhận xe tại 30+ điểm trong thành phố 🌿 Hỗ trợ kỹ thuật 24/7 🌿 Ưu đãi đến 10% tuần đầu thuê 🌿
      </p>
    </div>

    <!-- ACTIONS -->
    <div class="header__actions">
      <a href="../../pages/client/cart.html" class="nav__cart position-relative">
        <img src="../../assets/icons/cart.png" alt="Cart" />
        <span class="cart-badge">1</span>
      </a>

      <!-- NÚT LOGIN (ẩn/hiện tùy trạng thái người dùng) -->
      <button class="nav__login-btn" id="btnLogin">
        <img src="../../assets/icons/user.png" alt="User" />
        Đăng nhập
      </button>

      <!-- DROPDOWN USER (hiện khi đã đăng nhập) -->
      <div class="nav__user d-none" id="userMenu">
        <div class="dropdown">
          <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button" id="dropdownUser"
            data-bs-toggle="dropdown" aria-expanded="false">
            <img src="../../assets/icons/user-avatar.png" alt="User avatar" class="user-avatar" />
            <span>Hồng Phúc</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownUser">
            <li><a class="dropdown-item" href="../../pages/client/account.html">Tài khoản của tôi</a></li>
            <li><a class="dropdown-item" href="../../pages/client/orders.html">Lịch sử thuê xe</a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Đăng xuất</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav class="nav">
    <ul class="nav__menu">
      <li><a href="../../pages/client/homepage.html" class="nav__link nav__link--active">Trang chủ</a></li>
      <li><a href="../../pages/client/rent.html" class="nav__link">Đặt xe</a></li>
      <li><a href="../../pages/client/blog.html" class="nav__link">Blog</a></li>
      <li><a href="../../pages/client/about.html" class="nav__link">Về chúng tôi</a></li>
    </ul>
  </nav>
