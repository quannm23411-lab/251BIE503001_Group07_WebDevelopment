<header class="header">
  <div class="header__main">
    <!-- Logo -->
    <div class="header__logo">
      <img src="{{ROOT}}assets/logos/logo.png" alt="EcoMOVE Logo" />
      <span class="header__logo-text">EcoMOVE</span>
    </div>

    <!-- Search bar -->
    <form class="header__search">
      <input type="text" placeholder="Bạn muốn thuê gì hôm nay?" class="header__search-input" />
      <button type="submit" class="header__search-btn">
        <img src="{{ROOT}}assets/icons/search.png" alt="Tìm kiếm" />
      </button>
    </form>

    <!-- Dòng quảng cáo chạy (ngay cạnh search bar) -->
    <div class="header__ads">
      <p class="header__ads-text">
        🌿 Miễn phí giao/nhận xe tại 30+ điểm trong thành phố 🌿 Hỗ trợ kỹ thuật 24/7 🌿 Ưu đãi đến 10% tuần đầu thuê 🌿
      </p>
    </div>

    <!-- Hành động -->
    <div class="header__actions">
      <a href="{{ROOT}}pages/client/cart.html" class="nav__cart">
        <img src="{{ROOT}}assets/icons/cart.png" alt="Cart" />
        <span class="cart-badge">1</span>
      </a>
      <button class="nav__login-btn" onclick="window.location.href='{{ROOT}}pages/client/login.html'">
        <img src="{{ROOT}}assets/icons/user.png" alt="User" />
        Đăng nhập
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <ul class="nav__menu">
      <li><a href="{{ROOT}}pages/client/homepage.html" class="nav__link nav__link--active">Trang chủ</a></li>
      <li><a href="{{ROOT}}pages/client/rent.html" class="nav__link">Đặt xe</a></li>
      <li><a href="{{ROOT}}pages/client/blog.html" class="nav__link">Blog</a></li>
      <li><a href="{{ROOT}}pages/client/about.html" class="nav__link">Về chúng tôi</a></li>
    </ul>
  </nav>
</header>
