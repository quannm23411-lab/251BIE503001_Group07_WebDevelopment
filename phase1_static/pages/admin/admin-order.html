<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMOVE Admin - Quản lý đơn thuê xe</title>

    <link rel="stylesheet" href="../../css/admin-order.css">
    <link rel="icon" type="image/png" href="../../assets/logos/logo.png">
</head>

<body>
    <div class="admin">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar__logo">
                <img src="../../assets/logos/logo.png" alt="EcoMOVE Logo" />
                <h2>EcoMOVE</h2>
            </div>

            <ul class="sidebar__menu">
                <li>Dashboard</li>
                <li class="active">Quản lý xe</li>
                <li>Đơn thuê xe</li>
                <li>Khách hàng</li>
                <li>Marketing & Popup</li>
                <li>Giao diện website</li>
                <li>Tài khoản Admin</li>
                <li>Hệ thống & Nhật ký</li>
            </ul>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main">
            <header class="main__header">
                <h1>Quản lý đơn thuê xe</h1>
                <div class="actions">
                    <button class="btn-export">📦 Xuất danh sách</button>
                    <button class="btn-add">+ Thêm đơn thuê</button>
                </div>
            </header>

            <!-- ===== FILTER BAR ===== -->
            <section class="filters">
                <input type="text" id="searchInput" placeholder="Nhập mã đơn hoặc SĐT khách hàng...">

                <select id="brandFilter" required>
                    <option value="" disabled selected hidden>Hãng xe</option>
                </select>

                <select id="statusFilter" required>
                    <option value="" disabled selected hidden>Trạng thái</option>
                    <option value="Đang thuê">Đang thuê</option>
                    <option value="Đã trả">Đã trả</option>
                    <option value="Quá hạn">Quá hạn</option>
                </select>

                <select id="priceFilter" required>
                    <option value="" disabled selected hidden>Giá thuê</option>
                    <option value="<200000">Dưới 200.000đ</option>
                    <option value="200000-400000">200.000 - 400.000đ</option>
                    <option value=">400000">Trên 400.000đ</option>
                </select>

                <button id="applyFilter" class="btn-filter">Lọc</button>
            </section>

            <!-- ===== ORDER TABLE ===== -->
            <section class="order-list">
                <table>
                    <thead>
                        <tr>
                            <th>Mã đơn thuê</th>
                            <th>Khách hàng</th>
                            <th>Số điện thoại</th>
                            <th>Tên xe / Mã xe</th>
                            <th>Thời gian thuê</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="orderTable"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../../js/admin-order.js"></script>
</body>

</html>
