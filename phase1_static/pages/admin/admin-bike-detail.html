<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMOVE Admin - Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="../../css/admin-bike-detail.css">
    <link rel="icon" type="image/png" href="../../assets/logos/logo.png">
</head>

<body>
    <div class="admin">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar__logo">
                <img src="../../assets/logos/logo.png" alt="EcoMOVE Logo" />
                <h2>EcoMOVE</h2>
            </div>

            <ul class="sidebar__menu">
                <li>Dashboard</li>
                <li class="active">Quản lý xe</li>
                <li>Đơn thuê xe</li>
                <li>Khách hàng</li>
                <li>Marketing & Popup</li>
                <li>Giao diện website</li>
                <li>Tài khoản Admin</li>
                <li>Hệ thống & Nhật ký</li>
            </ul>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main">
            <header class="main__header">
                <button class="btn-back" onclick="window.history.back()">← Quay lại</button>
                <h1>Chi tiết sản phẩm</h1>
                <div class="actions">
                    <button class="btn-export">📦 Xuất danh sách</button>
                    <button class="btn-edit">✏️ Chỉnh sửa</button>
                    <button class="btn-delete">🗑️ Xóa</button>
                    <button class="btn-hide">👁️ Ẩn</button>
                </div>
            </header>

            <!-- ===== PRODUCT DETAIL ===== -->
            <section class="product-detail">
                <div class="product-images">
                    <h2 id="vehicleName">Tên xe</h2>
                    <img id="mainImage" src="../../assets/images/products/default.jpg" alt="Ảnh xe" class="main-img">
                    <div class="thumbs" id="thumbs"></div>
                </div>

                <div class="product-info">
                    <h3>Thông tin cơ bản</h3>
                    <form class="info-form">
                        <div class="form-group">
                            <label>Tên xe:</label>
                            <input type="text" id="name" readonly>
                        </div>

                        <div class="form-group">
                            <label>Mô tả:</label>
                            <textarea id="description" rows="4" readonly></textarea>
                        </div>

                        <div class="form-group">
                            <label>Biển số:</label>
                            <input type="text" id="licensePlate" readonly>
                        </div>

                        <div class="form-group">
                            <label>Thương hiệu:</label>
                            <input type="text" id="brand" readonly>
                        </div>

                        <div class="form-group">
                            <label>Loại xe:</label>
                            <div id="vehicleType" class="tag-group"></div>
                        </div>

                        <div class="form-group">
                            <label>Trạng thái:</label>
                            <div id="statusGroup" class="tag-group"></div>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../../js/admin-bike-detail.js"></script>
</body>

</html>
