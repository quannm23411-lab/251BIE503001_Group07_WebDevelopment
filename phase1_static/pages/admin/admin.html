<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMOVE Admin - Dashboard</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="icon" type="image/png" href="../../assets/logos/logo.png">
    <script src="../../js/admin.js"></script>
</head>

<body>
    <div class="admin">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar__logo">
                <img src="../../assets/logos/logo.png" alt="EcoMOVE Logo" />
                <h2>EcoMOVE</h2>
            </div>

            <ul class="sidebar__menu">
                <li>Dashboard</li>
                <li class="active">Quản lý xe</li>
                <li>Đơn thuê xe</li>
                <li>Khách hàng</li>
                <li>Marketing & Popup</li>
                <li>Giao diện website</li>
                <li>Tài khoản Admin</li>
                <li>Hệ thống & Nhật ký</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <header class="main__header">
                <h1>Tổng quan</h1>
                <button class="btn-export">📦 Xuất danh sách</button>
            </header>

            <!-- Stats -->
            <section class="stats">
                <div class="stat-card">
                    <h3>Xe cho thuê</h3>
                    <p id="carCount">-- / --</p>
                </div>
                <div class="stat-card">
                    <h3>Đơn thuê hôm nay</h3>
                    <p id="ordersToday">--</p>
                </div>
                <div class="stat-card">
                    <h3>Doanh thu tháng</h3>
                    <p id="monthlyRevenue">--</p>
                </div>
                <div class="stat-card">
                    <h3>Đăng ký mới</h3>
                    <p id="newUsers">--</p>
                </div>
            </section>

            <!-- Chart -->
            <section class="chart">
                <h2>Doanh thu theo tháng</h2>
                <canvas id="revenueChart"></canvas>
            </section>

            <!-- Notifications -->
            <section class="alerts">
                <h2>Thông báo hệ thống</h2>
                <ul id="alertList"></ul>
            </section>
        </main>
    </div>

    <script src="../../js/admin.js"></script>
</body>

</html>
