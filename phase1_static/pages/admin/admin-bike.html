<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoMOVE Admin - Quản lý xe</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/admin-bike.css" />
    <link rel="icon" type="image/png" href="../../assets/logos/logo.png" />
</head>

<body>
    <div class="admin">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar__logo">
                <img src="../../assets/logos/logo.png" alt="EcoMOVE Logo" />
                <h2>EcoMOVE</h2>
            </div>

            <ul class="sidebar__menu">
                <li>Dashboard</li>
                <li class="active">Quản lý xe</li>
                <li>Đơn thuê xe</li>
                <li>Khách hàng</li>
                <li>Marketing & Popup</li>
                <li>Giao diện website</li>
                <li>Tài khoản Admin</li>
                <li>Hệ thống & Nhật ký</li>
            </ul>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main">
            <header class="main__header">
                <h1>Quản lý xe</h1>
                <div class="actions">
                    <button class="btn-export">📦 Xuất danh sách</button>
                    <button class="btn-add">+ Thêm sản phẩm</button>
                </div>
            </header>

            <!-- ===== FILTERS ===== -->
            <section class="filters">
                <input type="text" id="searchInput" placeholder="Nhập tên xe hoặc mã..." />

                <select id="brandFilter" required>
                    <option value="" disabled selected hidden>Hãng xe</option>
                </select>

                <select id="statusFilter" required>
                    <option value="" disabled selected hidden>Trạng thái</option>
                    <option value="Sẵn sàng">Sẵn sàng</option>
                    <option value="Đang cho thuê">Đang cho thuê</option>
                    <option value="Bảo trì">Bảo trì</option>
                </select>

                <select id="priceFilter" required>
                    <option value="" disabled selected hidden>Giá thuê</option>
                    <option value="<100000">Dưới 100.000đ</option>
                    <option value="100000-150000">100.000 - 150.000đ</option>
                    <option value=">150000">Trên 150.000đ</option>
                </select>

                <button id="applyFilter" class="btn-filter">Lọc</button>
            </section>

            <!-- ===== TABLE ===== -->
            <section class="bike-list">
                <table>
                    <thead>
                        <tr>
                            <th>Tên xe / Mã xe</th>
                            <th>Giá thuê (ngày)</th>
                            <th>Dung lượng pin</th>
                            <th>Quãng đường / lần sạc</th>
                            <th>Trạng thái</th>
                            <th>Khu vực</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="bikeTable">
                        <!-- Dữ liệu render bởi JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- JS -->
    <script src="../../js/admin-bike.js"></script>
</body>

</html>
