<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMOVE - Đăng nhập</title>
  <link rel="stylesheet" href="../../css/form-login.css">
</head>
<body>
  <div class="container">
    <aside class="left-panel"></aside>
    
    <section class="right-panel">
      <header class="header">
        <div class="welcome-text">Chào mừng đến với</div>
        <div class="logo-text">EcoMOVE</div>
      </header>

      <div class="form-container">
        <h1 class="form-title">ĐĂNG NHẬP</h1>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Địa chỉ email</label>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="Nhập email của bạn"
            />
            <p id="email-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mật khẩu</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                class="form-input" 
                placeholder="Nhập mật khẩu"
              />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <span>Hiện</span>
              </button>
            </div>
            <p id="password-error" class="error-message"></p>
          </div>

          <div class="form-options">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" class="checkbox" />
              <label for="remember" class="checkbox-label">Lưu phiên đăng nhập?</label>
            </div>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="submit-btn">Đăng nhập</button>

          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Hoặc</span>
            <div class="divider-line"></div>
          </div>

          <button type="button" class="google-btn" id="googleLogin">
            <img 
              class="google-icon" 
              alt="Google" 
              src="https://c.animaapp.com/mhjuj4fe00QeVo/img/frame-1.svg"
            />
            Đăng nhập bằng Google
          </button>
        </form>

        <footer class="footer">
          <p>
            <span class="footer-text">Bạn chưa có tài khoản?</span>
            <a href="form-sign-up.html" class="footer-link">Đăng ký ngay</a>          </p>
        </footer>
      </div>
    </section>
  </div>

  <div id="success-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>Đăng nhập thành công!</h2>
      <p>Chào mừng bạn trở lại! Bạn sẽ được chuyển đến trang chủ.</p>
      <button id="modal-close-btn" class="submit-btn">Đóng</button>
    </div>
  </div>
  <script src="../../js/form-login.js"></script>
</body>
</html>
