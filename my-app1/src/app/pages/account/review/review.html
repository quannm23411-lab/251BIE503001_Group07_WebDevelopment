<div class="account-bg"></div>

<div class="crumb">
  <a routerLink="/">Trang chủ</a> / <a routerLink="/account/orders">Lịch sử thuê xe</a> / <b>Xem đánh giá</b>
</div>

<div class="account-wrap">
  <aside class="account-aside">
    <div class="card user-mini">
      <div class="hello">Xin chào,</div>
      <div class="name">{{ user.fullname }}</div>
      <nav class="menu">
        <a routerLink="/account/profile">Thông tin tài khoản</a>
        <a routerLink="/account/orders">Lịch sử thuê xe</a>
        <a routerLink="/logout">Đăng xuất</a>
      </nav>
    </div>
  </aside>

  <main class="account-main">
    <div class="card scroll">
      <h2>⭐ Xem đánh giá</h2>

      <div class="order-top">
        <img [src]="review.img" alt="xe">
        <div class="meta">
          <h3>{{review.bike}}</h3>
          <p>Ngày nhận: {{review.start}}</p>
          <p>Ngày trả: {{review.end}}</p>
          <p>ID đơn hàng: {{id}}</p>
        </div>
        <div class="status">{{review.status}}</div>
        <div class="actions">
          <button routerLink="/account/orders">Thuê lại</button>
        </div>
      </div>

      <div class="feedback">
        <div class="who">
          <img src="/assets/images/avatars/default.png" class="avatar" alt="avatar">
          <div>
            <b>Hồng Phúc</b>
            <div class="stars">★★★★★</div>
          </div>
        </div>
        <p class="text">{{review.text}}</p>
        <img src="/assets/images/review-photo.jpg" class="photo" alt="ảnh review">
        <div class="time">{{review.time}}</div>
      </div>
    </div>
  </main>
</div>
