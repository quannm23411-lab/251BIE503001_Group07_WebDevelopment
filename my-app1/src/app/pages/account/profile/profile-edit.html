<div class="account-bg"></div>

<div class="crumb">
  <a routerLink="/">Trang chủ</a> / <a routerLink="/account/profile">Tài khoản</a> / <b>Chỉnh sửa</b>
</div>

<div class="account-wrap">
  <aside class="account-aside">
    <div class="card user-mini">
      <div class="hello">Xin chào,</div>
      <div class="name">{{ form.value.fullname || 'Người dùng' }}</div>
      <nav class="menu">
        <a routerLink="/account/profile">Thông tin tài khoản</a>
        <a routerLink="/account/orders">Lịch sử thuê xe</a>
        <a routerLink="/logout">Đăng xuất</a>
      </nav>
    </div>
  </aside>

  <main class="account-main">
    <div class="card scroll">
      <div class="head">
        <div class="user">
          <img [src]="form.value.avatar || '/assets/images/avatars/default.png'" class="avatar" alt="avatar">
          <div class="meta">
            <h2>{{ form.value.fullname || 'Người dùng' }}</h2>
            <span class="badge gold">EcoGold</span>
          </div>
        </div>
        <button class="btn primary" (click)="save()">Lưu</button>
      </div>

      <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
        <div class="form-row">
          <label>Ảnh đại diện</label>
          <div class="avatar-edit">
            <img [src]="form.value.avatar || '/assets/images/avatars/default.png'" alt="avatar">
            <input type="file" accept="image/*" #file hidden (change)="onPickAvatar(file)">
            <button type="button" class="btn" (click)="file.click()">Chỉnh sửa ảnh</button>
          </div>
        </div>

        <div class="form-row">
          <label>Họ và tên</label>
          <input type="text" formControlName="fullname" placeholder="Nhập họ tên">
          <div class="err" *ngIf="form.controls.fullname.touched && form.controls.fullname.invalid">Họ tên tối thiểu 2 ký tự</div>
        </div>

        <div class="form-row">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="you@example.com">
          <div class="err" *ngIf="form.controls.email.touched && form.controls.email.invalid">Email chưa hợp lệ</div>
        </div>

        <div class="form-row">
          <label>Mật khẩu</label>
          <div class="pwd">
            <input [type]="showPwd() ? 'text' : 'password'" formControlName="password" placeholder="Mật khẩu">
            <button type="button" class="icon" (click)="togglePwd()">👁</button>
          </div>
          <div class="err" *ngIf="form.controls.password.touched && form.controls.password.invalid">Tối thiểu 8 ký tự</div>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Lưu</button>
          <button type="button" class="btn" (click)="cancel()">Hủy</button>
        </div>
      </form>
    </div>
  </main>
</div>
