<div class="account-bg"></div>

<div class="account-breadcrumb">
  <a routerLink="/">Trang chủ</a> /
  <span>Tài khoản</span> /
  <b>Lịch sử thuê xe</b>
</div>

<div class="account-layout">
  <!-- Sidebar -->
  <div class="account-sidebar-wrap">
    <div class="account-sidebar">
      <div class="hello">Xin chào,</div>
      <div class="name">{{ user.fullname }}</div>
      <div class="menu">
        <a routerLink="/account/profile">Thông tin tài khoản</a>
        <a routerLink="/account/orders" class="active">Lịch sử thuê xe</a>
        <a routerLink="/logout" class="logout">Đăng xuất</a>
      </div>
    </div>
  </div>

  <!-- Card trắng -->
  <div class="account-main-card">
    <div class="account-orders-head">
      <div class="account-orders-head-title">
        <i class="bi bi-clock-history"></i>
        <h2>LỊCH SỬ THUÊ XE</h2>
      </div>

      <div class="account-search">
        <input
          type="text"
          placeholder="Tìm kiếm theo tên hàng, ID đơn hàng..."
        />
        <button type="button" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <div class="account-order-card" *ngFor="let o of orders">
      <img [src]="o.img" [alt]="o.name" />
      <div class="account-order-meta">
        <h3>{{ o.name }}</h3>
        <p>Ngày nhận: {{ o.start }}</p>
        <p>Ngày trả: {{ o.end }}</p>
        <p>ID đơn hàng: {{ o.id }}</p>
      </div>

      <div
        class="account-order-status"
        [ngClass]="{ 'is-finished': o.status === 'Hoàn thành' }"
      >
        {{ o.status }}
      </div>

      <div class="account-order-actions">
        <button
          *ngIf="o.status === 'Hoàn thành'; else disabledReview"
          class="btn-outline-red"
          type="button"
          [routerLink]="['/account/review', o.id]"
        >
          Đánh giá
        </button>

        <ng-template #disabledReview>
          <button class="btn-outline-gray" type="button" disabled>
            Xem đánh giá
          </button>
        </ng-template>

        <button class="btn-green" type="button">
          Thuê lại
        </button>
      </div>
    </div>
  </div>
</div>
