<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
/>

<div class="account-bg"></div>

<div class="account-breadcrumb">
  <a routerLink="/">Trang chủ</a> /
  <span>Tài khoản</span> /
  <b>Lịch sử thuê xe</b>
</div>

<div class="account-layout">
  <!-- Sidebar -->
  <div class="account-sidebar-wrap">
    <div class="account-sidebar">
      <div class="hello">Xin chào,</div>
      <div class="name">{{ user.fullname }}</div>
      <div class="menu">
        <a routerLink="/account/profile">Thông tin tài khoản</a>
        <a routerLink="/account/orders" class="active">Lịch sử thuê xe</a>
        <a routerLink="/logout" class="logout">Đăng xuất</a>
      </div>
    </div>
  </div>

  <!-- Card trắng -->
  <div class="account-main-card">
    <!-- Hàng avatar + tên + EcoBasic -->
    <div class="account-main-head">
      <div class="account-user-box">
        <div class="account-avatar-wrap">
          <img [src]="user.avatar" alt="Avatar" />
        </div>
        <div class="account-user-meta">
          <h2>{{ user.fullname }}</h2>
          <div class="account-tier-badge">
            {{ user.tier || 'EcoBasic' }}
          </div>
        </div>
      </div>
      <div></div>
    </div>

    <!-- Hàng tiêu đề + ô tìm kiếm -->
    <div class="account-orders-head">
      <div class="account-orders-head-title">
        <i class="bi bi-clock-history"></i>
        <h2>LỊCH SỬ THUÊ XE</h2>
      </div>

      <div class="account-search">
        <input
          type="text"
          placeholder="Tìm kiếm theo tên hàng, ID đơn hàng..."
        />
        <button type="button" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <!-- Danh sách đơn thuê -->
    <div class="account-order-card" *ngFor="let o of orders">
      <!-- Cột ảnh -->
      <img [src]="o.img" [alt]="o.name" />

      <!-- Cột thông tin đơn -->
      <div class="account-order-meta">
        <h3>{{ o.name }}</h3>
        <p>Ngày nhận: {{ o.start }}</p>
        <p>Ngày trả: {{ o.end }}</p>
        <p>ID đơn hàng: {{ o.id }}</p>
      </div>

      <!-- Cột trạng thái -->
      <div
        class="account-order-status"
        [ngClass]="{
          'is-finished': o.status === 'Hoàn thành',
          'is-renting': o.status === 'Đang thuê',
          'is-upcoming': o.status === 'Sắp nhận xe'
        }"
      >
        {{ o.status }}
      </div>

      <!-- Cột nút hành động -->
      <div class="account-order-actions">
        <!-- Chỉ hiển thị nút khi đã Hoàn thành -->
        <ng-container *ngIf="o.status === 'Hoàn thành'">
          <!-- Chưa đánh giá thì cho phép Đánh giá (demo, chưa lưu data) -->
          <button
            class="btn-outline-red"
            type="button"
            [routerLink]="['/account/review', o.id, 'write']"
          >
            Đánh giá
          </button>

          <!-- Đã đánh giá thì có thể dùng template riêng, hiện tại để sẵn -->
          <ng-template #hasReviewBlock>
            <button
              class="btn-outline-gray"
              type="button"
              [routerLink]="['/account/review', o.id]"
            >
              Xem đánh giá
            </button>
          </ng-template>

          <!-- Nút Thuê lại -->
          <button
            class="btn-outline-red"
            type="button"
            (click)="rentAgain(o)"
          >
            Thuê lại
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>
