<div class="container">
  <aside class="left-panel"></aside>
  
  <section class="right-panel">
    <header class="header">
      <div class="welcome-text">Chào mừng đến với</div>
      <div class="logo-text">EcoMOVE</div>
    </header>

    <div class="form-container">
      <h1 class="form-title">ĐĂNG NHẬP</h1>

      <form id="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        
        <div class="form-group">
          <label for="email" class="form-label">Địa chỉ email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="Nhập email của bạn"
            formControlName="email"
            [ngClass]="{ 'input-error': email.invalid && (email.dirty || email.touched) }"
          />
          <div *ngIf="email.invalid && (email.dirty || email.touched)" class="error-message">
            <p *ngIf="email.errors?.['required']">
              Vui lòng nhập email.
            </p>
            <p *ngIf="email.errors?.['email']">
              Email không hợp lệ.
            </p>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Mật khẩu</label>
          <div class="password-wrapper">
            <input 
              [type]="passwordFieldType" 
              id="password" 
              class="form-input" 
              placeholder="Nhập mật khẩu"
              formControlName="password"
              [ngClass]="{ 'input-error': password.invalid && (password.dirty || password.touched) }"
            />
            <button type="button" class="toggle-password" id="togglePassword" (click)="togglePasswordVisibility()">
              <span>{{ passwordFieldType === 'password' ? 'Hiện' : 'Ẩn' }}</span>
            </button>
          </div>
          <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error-message">
            <p *ngIf="password.errors?.['required']">
              Vui lòng nhập mật khẩu.
            </p>
          </div>
        </div>

        <div class="form-options">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember" class="checkbox" formControlName="remember" />
            <label for="remember" class="checkbox-label">Lưu phiên đăng nhập?</label>
          </div>
          <a href="#" class="forgot-password" (click)="handleForgotPassword(); $event.preventDefault()">
            Quên mật khẩu?
          </a>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">Đăng nhập</button>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Hoặc</span>
          <div class="divider-line"></div>
        </div>

        <button type="button" class="google-btn" id="googleLogin" (click)="handleGoogleLogin()">
          <img 
            class="google-icon" 
            alt="Google" 
            src="https://c.animaapp.com/mhjuj4fe00QeVo/img/frame-1.svg"
          />
          Đăng nhập bằng Google
        </button>
      </form>

      <footer class="footer">
        <p>
          <span class="footer-text">Bạn chưa có tài khoản?</span>
          <a routerLink="/register" class="footer-link">Đăng ký ngay</a>
        </p>
      </footer>
    </div>
  </section>
</div>

<div id="success-modal" class="modal-overlay" 
    *ngIf="isModalVisible" 
    (click)="closeModalAndNavigate()">
  
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Đăng nhập thành công!</h2>
    <p>Chào mừng bạn trở lại! Bạn sẽ được chuyển đến trang chủ.</p>
    <button id="modal-close-btn" class="submit-btn" (click)="closeModalAndNavigate()">Đóng</button>
  </div>
</div>
