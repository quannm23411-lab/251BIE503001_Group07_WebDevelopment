<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

<section class="about__hero">
  <div class="container">

    <div class="about__logo">
      <img src="../../../assets/images/logofull.png" alt="EcoMOVE logo" />
    </div>

    <p class="about__lead" [innerHTML]="data.heroLead"></p>

    <p class="about__sublead" [innerHTML]="data.heroSubLead"></p>

    <!-- 3 card số liệu -->
    <div class="about__stats">
      <div class="stat-card" *ngFor="let item of data.stats; let i = index" [class.stat-card--highlight]="i === 1">
        <div class="stat-card__value">
          {{ item.value }}
        </div>
        <div class="stat-card__label">
          {{ item.label }}
        </div>
      </div>
    </div>
  </div>
</section>

<!--PHẦN 2: SỨ MỆNH -->
<section class="about__values">
  <div class="container">
    <div class="about__values-panel">
      <div class="values-grid">

        <div class="value" *ngFor="let v of data.values">
          <div class="value__icon">
            <i [class]="v.icon" aria-hidden="true"></i>
          </div>

          <h3 class="value__title">
            {{ v.title }}
          </h3>

          <p class="value__text">
            {{ v.text }}
          </p>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- PHẦN 3: ĐỐI TÁC ĐỒNG HÀNH -->
<section class="about__partners" id="partners">
  <div class="container">

    <h2 class="about-section-title">
      <span> ĐỐI TÁC ĐỒNG HÀNH</span>
    </h2>

    <div class="partners-grid">
      <div class="partner" *ngFor="let p of data.partners">

        <h3 class="partner__title">{{ p.title }}</h3>

        <div class="partner__logos">
          <img *ngFor="let logo of p.logos" [src]="logo" alt="Logo" />
        </div>

        <p class="partner__text">
          {{ p.description }}
        </p>

      </div>
    </div>

  </div>
</section>

<!-- PHẦN 4: ĐỘI NGŨ -->
<section class="about__team">
  <div class="container">

    <h2 class="about-section-title">
      <span>ĐỘI NGŨ ECOMOVE</span>
    </h2>

    <div class="team-grid">
      <div class="team-member" *ngFor="let t of data.team">

        <div class="team-member__avatar">
          <img *ngIf="t.avatar" [src]="t.avatar" [alt]="t.name" />
        </div>

        <h3 class="team-member__name">{{ t.name }}</h3>

        <div class="team-member__socials">
          <a [href]="t.facebook" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-facebook"></i>
          </a>
          <a [href]="t.linkedin" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-linkedin"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- PHẦN 5: THÔNG TIN LIÊN HỆ -->
<section class="about__contact">
  <div class="container">
    <h2 class="about-section-title about-section-title--contact">
      THÔNG TIN LIÊN HỆ
    </h2>

    <div class="contact-grid">
      <div class="contact-item" *ngFor="let item of data.contactItems">
        <div class="contact-item__icon">
          <i [class]="item.icon"></i>
        </div>

        <h3 class="contact-item__title">
          {{ item.title }}
        </h3>

        <p
          *ngIf="item.contentHtml"
          class="contact-item__text"
          [innerHTML]="item.contentHtml">
        </p>

        <!-- Trường hợp có socials (MẠNG XÃ HỘI: 4 logo) -->
        <div
          *ngIf="item.socials"
          class="contact-item__socials">
          <a
            *ngFor="let social of item.socials"
            class="social-logo-link"
            [href]="social.href"
            target="_blank"
            rel="noopener noreferrer">
            <img
              [src]="social.imgSrc"
              [alt]="social.name"
              class="social-logo-img">
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- PHẦN 6: BLOG -->
<section class="about__blog">
  <div class="container">

    <h2 class="about-section-title about-section-title--blog">
      BLOG
    </h2>

    <div class="about-blog-row">
      <!-- nút mũi tên trái -->
      <button class="about-blog-arrow" type="button" (click)="showPrevBlog()">
        <i class="bi bi-chevron-left"></i>
      </button>

      <!-- LIST 2 CARD BLOG -->
      <div class="blog-grid">
        <a class="blog-teaser-card"
           *ngFor="let item of visibleBlogOffers"
           [routerLink]="['/blog/details', item.type, item.id]">

          <!-- Ảnh -->
          <div class="thumb" [style.background-image]="'url(' + item.image + ')'"></div>

          <!-- Nội dung -->
          <div class="blog-content">
            <h3 class="blog-title">
              {{ item.title }}
            </h3>

            <p class="blog-excerpt">
              {{ item.excerpt }}
            </p>

            <div class="blog-meta">
              <i class="bi bi-calendar"></i>
              <span>{{ item.date | date:'dd/MM/yyyy' }}</span>
            </div>
          </div>
        </a>
      </div>

      <!-- nút mũi tên phải -->
      <button class="about-blog-arrow" type="button" (click)="showNextBlog()">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</section>
