<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<main class="main-content container-fluid">
<main class="main-content container-fluid mt-5 pt-4">
  <!-- FILTER BAR -->
  <section class="filter-section container">
    <div class="filter-header d-flex align-items-center justify-content-start gap-3 mb-3 flex-wrap">
      <button class="btn btn-green dropdown-toggle">Thuê theo ngày</button>

      <div class="date-picker">
        <label for="start-date">Ngày thuê</label>
        <input id="start-date" type="date" value="2025-11-08" />
      </div>

      <div class="date-picker">
        <label for="end-date">Ngày trả</label>
        <input id="end-date" type="date" value="2025-11-12" />
      </div>

      <div class="location">
        <label for="city">Tỉnh/Thành phố</label>
        <select id="city">
          <option selected>TP.Hồ Chí Minh</option>
          <option>Hà Nội</option>
          <option>Đà Nẵng</option>
        </select>
      </div>
    </div>

    <div class="filter-body">
      <h3 class="filter-title">
        BỘ LỌC <i class="bi bi-filter"></i>
      </h3>

      <div class="filter-row">
        <span class="filter-label">Loại xe:</span>
        <label>
          <input type="checkbox" (change)="toggleType('Xe máy điện', $event.target.checked)" />
          Xe máy điện
        </label>
        <label>
          <input type="checkbox" (change)="toggleType('Xe đạp điện', $event.target.checked)" />
          Xe đạp điện
        </label>
        <label>
          <input type="checkbox" (change)="toggleType('Xe đạp điện gấp gọn', $event.target.checked)" />
          Xe đạp điện gấp gọn
        </label>
      </div>

      <div class="filter-row">
        <span class="filter-label">Thương hiệu:</span>
        <label><input type="checkbox" (change)="toggleBrand('Vinfast', $event.target.checked)" /> Vinfast</label>
        <label><input type="checkbox" (change)="toggleBrand('Yadea', $event.target.checked)" /> Yadea</label>
        <label><input type="checkbox" (change)="toggleBrand('Dat Bike', $event.target.checked)" /> Dat Bike</label>
        <label><input type="checkbox" (change)="toggleBrand('Dibao', $event.target.checked)" /> Dibao</label>
        <label><input type="checkbox" (change)="toggleBrand('Pega', $event.target.checked)" /> Pega</label>
      </div>

      <div class="filter-row align-items-center flex-wrap">
        <span class="filter-label">Giá:</span>
        <input type="range" min="0" max="500000" step="10000" [value]="maxPrice()" class="price-range"
          (input)="onPrice($any($event.target).value)" />
        <span class="price-value">{{ formatVND(maxPrice()) }}</span>

        <div class="sort ms-auto d-flex align-items-center gap-2 flex-wrap">
          <span class="filter-label">Sắp xếp theo:</span>

          <button class="btn btn-outline" [class.btn-green-outline]="sortKey()==='popular'"
            [class.active]="sortKey()==='popular'" (click)="setSort('popular')">
            Phổ biến
          </button>

          <button class="btn btn-outline" [class.btn-green-outline]="sortKey()==='newest'"
            [class.active]="sortKey()==='newest'" (click)="setSort('newest')">
            Mới nhất
          </button>

          <button class="btn btn-outline" [class.btn-green-outline]="sortKey()==='price_asc'"
            [class.active]="sortKey()==='price_asc'" (click)="setSort('price_asc')">
            Giá Thấp - Cao
          </button>

          <button class="btn btn-outline" [class.btn-green-outline]="sortKey()==='price_desc'"
            [class.active]="sortKey()==='price_desc'" (click)="setSort('price_desc')">
            Giá Cao - Thấp
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <section class="top-rent container py-5">
    <div class="product-grid">
      <ng-container *ngIf="topRentList().length > 0; else noTop">
        <a class="product-card position-relative" *ngFor="let p of topRentList()" [routerLink]="['/rent', p.id]">
          <span *ngIf="p.discount > 0" class="badge bg-danger position-absolute top-0 start-0 m-2">
            -{{ p.discount }}%
          </span>

          <img class="product-card__img" [src]="p.image" [alt]="p.vehicleName" loading="lazy" />

          <div class="product-card__features">
            <span><i class="bi bi-scooter"></i>Xe máy điện</span>
            <span>Hỗ trợ GPS</span>
            <span>200 km/lần sạc</span>
            <span>Tối đa 90km/h</span>
          </div>

          <div class="product-card__body">
            <h3 class="product-card__name">{{ p.vehicleName }}</h3>
            <p class="product-card__price">
              Giá thuê chỉ từ <span>{{ formatVND(p.pricePerDay) }}</span>
            </p>
            <small [ngClass]="p.availabilityStatus ? 'text-success' : 'text-secondary'">
              {{ p.availabilityStatus ? 'Còn xe' : 'Hết xe' }}
            </small>
          </div>
        </a>
      </ng-container>
      <ng-template #noTop>
        <p class="text-muted">Chưa có xe phù hợp.</p>
      </ng-template>
      </div>

      <!-- Pagination -->
      <div class="pager d-flex justify-content-center gap-2 mt-3" *ngIf="totalPages() > 1">
        <button class="btn btn-outline-secondary" (click)="goto(page()-1)" [disabled]="page()===1">Trước</button>

        <ng-container *ngFor="let n of [].constructor(totalPages()); let i = index">
          <button class="btn btn-outline-success" [class.active]="page()===(i+1)" (click)="goto(i+1)">
            {{ i+1 }}
          </button>
        </ng-container>

        <button class="btn btn-outline-secondary" (click)="goto(page()+1)"
          [disabled]="page()===totalPages()">Sau</button>
      </div>
  </section>
</main>
