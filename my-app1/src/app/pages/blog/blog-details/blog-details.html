<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

<section class="blog-detail" *ngIf="item as itm">
  <div class="page-gradient-bg" aria-hidden="true"></div>

  <div class="bd-wrap">
    <!-- ẢNH HERO -->
    <div class="bd-hero">
      <div class="bd-hero-frame">
        <img class="bd-hero-img" [src]="itm.image" [alt]="itm.title" />
      </div>
    </div>

    <!-- THÂN BÀI -->
    <div class="bd-body">
      <div class="bd-info-chip" [ngClass]="badgeClass">
        <i class="bi bi-gift" *ngIf="type === 'offers'"></i>
        <i class="bi bi-stars" *ngIf="type === 'products'"></i>
        <i class="bi bi-newspaper" *ngIf="type === 'news'"></i>
        {{ badgeText }}
      </div>

      <h1 class="bd-info-title">{{ itm.title }}</h1>
      <p class="bd-info-excerpt">{{ itm.excerpt }}</p>

      <div class="bd-info-meta">
        <span><i class="bi bi-calendar3"></i> {{ formatVN(itm.date) }}</span>
        <span class="dot">•</span>
        <span *ngIf="itm.category">
          <i class="bi bi-tag"></i> {{ itm.category }}
        </span>
      </div>

      <div class="bd-actions">
        <button type="button" class="btn-ghost" (click)="showContent = !showContent">
          <i class="bi bi-file-earmark-text"></i>
          {{ showContent ? 'Ẩn nội dung bài viết' : 'Xem nội dung bài viết' }}
        </button>
      </div>

      <!-- FULL CONTENT (render từ JSON) -->
      <article id="full-content" class="bd-content" *ngIf="showContent">
        <ng-container *ngIf="itm.content && itm.content.length">
          <ng-container *ngFor="let block of itm.content">

            <!-- HEADING -->
            <h2 *ngIf="block.type === 'heading'">
              {{ block.text }}
            </h2>

            <!-- PARAGRAPH -->
            <p *ngIf="block.type === 'paragraph'">
              {{ block.text }}
            </p>

            <!-- BULLET LIST -->
            <ul *ngIf="block.type === 'list'">
              <li *ngFor="let li of block.items">
                {{ li }}
              </li>
            </ul>

            <!-- NUMBERED LIST -->
            <ol *ngIf="block.type === 'list-number'">
              <li *ngFor="let li of block.items">
                {{ li }}
              </li>
            </ol>

            <!-- QUOTE -->
            <blockquote *ngIf="block.type === 'quote'">
              {{ block.text }}
            </blockquote>

          </ng-container>
        </ng-container>
      </article>

      <div class="bd-actions">
        <a class="btn-primary" routerLink="/rent">
          <i class="bi bi-bag-check"></i> Thuê ngay tại EcoMove
        </a>
      </div>
    </div>

    <!-- BÀI VIẾT LIÊN QUAN -->
    <div class="related-section" *ngIf="related?.length">
      <h3 class="related-title">
        Bài viết <span class="highlight">liên quan</span>
      </h3>

      <div class="related-grid">
        <a class="related-card"
          *ngFor="let r of related; trackBy: trackById"
          [routerLink]="['/blog/details', type, r.id]">

          <img class="related-thumb" [src]="r.image" [alt]="r.title" />

          <div class="related-body">
            <h4 class="related-card-title">{{ r.title }}</h4>

            <div class="related-date">
              <i class="bi bi-calendar3"></i>
              <span>{{ formatVN(r.date) }}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
