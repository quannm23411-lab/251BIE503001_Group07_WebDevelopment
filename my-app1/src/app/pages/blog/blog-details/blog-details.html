<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

<section class="blog-detail" *ngIf="item">
    <!-- Gradient nền toàn trang -->
    <div class="page-gradient-bg" aria-hidden="true"></div>

    <div class="bd-wrap">
        <!-- HERO banner -->
        <div class="bd-hero">
            <div class="bd-hero-frame">
                <img class="bd-hero-img" [src]="item?.image" [alt]="item?.title" />
            </div>
        </div>

        <!-- NỘI DUNG -->
        <div class="bd-body">
            <div class="bd-info-chip" [ngClass]="badgeClass">
                <i class="bi bi-gift" *ngIf="type==='offers'"></i>
                <i class="bi bi-stars" *ngIf="type==='products'"></i>
                <i class="bi bi-newspaper" *ngIf="type==='news'"></i>
                {{ badgeText }}
            </div>

            <h1 class="bd-info-title">{{ item.title }}</h1>
            <p class="bd-info-excerpt">{{ item.excerpt }}</p>

            <div class="bd-info-meta">
                <span><i class="bi bi-calendar3"></i> {{ formatVN(item.date) }}</span>
                <span class="dot">•</span>
                <span *ngIf="item.category"><i class="bi bi-tag"></i> {{ item.category }}</span>
            </div>

            <div class="bd-actions">
                <button type="button" class="btn-ghost" (click)="showContent = !showContent">
                    <i class="bi bi-file-earmark-text"></i>
                    {{ showContent ? 'Ẩn nội dung bài viết' : 'Xem nội dung bài viết' }}
                </button>
            </div>

            <article id="full-content" class="bd-content" *ngIf="showContent" [innerHTML]="item.content || ''">
            </article>
            <div class="bd-actions">
                <a class="btn-primary" routerLink="/mua-ngay">
                    <i class="bi bi-bag-check"></i> Thuê ngay tại EcoMove
                </a>
            </div>

        </div><!-- /bd-body -->

        <!-- BÀI VIẾT LIÊN QUAN -->
        <div class="related-section" *ngIf="related?.length">
            <h3 class="related-title">Bài viết <span class="highlight">liên quan</span></h3>

            <div class="related-grid">
                <a class="related-card" *ngFor="let r of related; trackBy: trackById"
                    [routerLink]="['/blog/details', type, r.id]">
                    <img class="related-thumb" [src]="r.image" [alt]="r.title">
                    <div class="related-body">
                        <h4 class="related-card-title">{{ r.title }}</h4>
                        <div class="related-date">
                            <i class="bi bi-calendar3"></i><span>{{ formatVN(r.date) }}</span>
                        </div>
                    </div>
                </a>
            </div>
        </div><!-- /related-section -->
    </div><!-- /bd-wrap -->
</section>
