<main class="page">
  <!-- Thanh xanh: breadcrumb -->
  <section class="blog-crumbbar">
    <div class="inner">
      <nav class="crumb" aria-label="Breadcrumb">
        <a class="crumb-link" routerLink="/">Trang chủ</a>
        <span class="sep">/</span>
        <!-- 👉 trỏ thẳng về /blog/offers -->
        <a class="crumb-link" routerLink="/blog/offers">Blog</a>
        <span class="sep1">/</span>
        <span class="current">{{ crumb() }}</span>
      </nav>
    </div>
  </section>

  <!-- Tabs -->
  <section class="blog-tabs" *ngIf="showTabs()">
    <div class="inner tabs">
      <a routerLink="offers" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        [class.active]="activeTab() === 'offers'" class="tab">
        ƯU ĐÃI
      </a>

      <a routerLink="products" routerLinkActive="active" [class.active]="activeTab() === 'products'" class="tab">
        SẢN PHẨM MỚI
      </a>

      <a routerLink="news" routerLinkActive="active" [class.active]="activeTab() === 'news'" class="tab">
        TIN TỨC
      </a>
    </div>
  </section>

  <!-- Nội dung từng tab -->
  <router-outlet />
</main>
