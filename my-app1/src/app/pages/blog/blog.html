<main class="page">
  <!-- Thanh xanh: CHỈ breadcrumb -->
  <section class="blog-crumbbar">
    <div class="inner">
      <nav class="crumb" aria-label="Breadcrumb">
        <a class="crumb-link" routerLink="/">Trang chủ</a>
        <span class="sep">/</span>
        <a class="crumb-link" routerLink="/blog">Blog</a>
        <span class="sep1">/</span>
        <span class="current">{{ crumb }}</span>
      </nav>
    </div>
  </section>

  <!-- Tabs phía dưới, nền trắng -->
  <section class="blog-tabs">
    <div class="inner tabs">
      <a
        routerLink="offers"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="tab"
        >ƯU ĐÃI</a
      >
      <a routerLink="products" routerLinkActive="active" class="tab"
        >SẢN PHẨM MỚI</a
      >
      <a routerLink="news" routerLinkActive="active" class="tab">TIN TỨC</a>
    </div>
  </section>

  <!-- Nội dung từng tab -->
  <router-outlet />
</main>
