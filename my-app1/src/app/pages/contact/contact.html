<div class="contact-icons">

<button 
    class="contact-icon backtotopclass" 
    (click)="scrollToTop()" 
    [class.visible]="showBackToTop">
    <img src="../../../assets/images/logo_social/up-arrow.png" alt="Back to top" />
  </button>
  <!-- Zalo Icon -->
  <a href="https://is.uel.edu.vn/" target="_blank" class="contact-icon zaloclass">
    <img src="../../../assets/images/logo_social/logozalo.png" alt="Zalo" />
  </a>
  <!-- Messenger Icon -->
  <a href="https://www.facebook.com/khoahttt.uel?locale=vi_VN" target="_blank" class="contact-icon messengerclass">
    <img src="../../../assets/images/logo_social/logomessenger.png" alt="Messenger" />
  </a>
  <!-- Facebook Icon -->
  <a href="https://www.facebook.com/khoahttt.uel?locale=vi_VN" target="_blank" class="contact-icon facebookclass">
    <img src="../../../assets/images/logo_social/logofacebook.png" alt="Facebook" />
  </a>
</div>

<!-- Optional: Popup chat box -->
<div class="chat-popup" *ngIf="isChatVisible">
  <h4>Chat with us</h4>
  <button (click)="closeChat()">Close</button>
  <!-- Embed Zalo chat iframe or any other chat here -->
</div>
