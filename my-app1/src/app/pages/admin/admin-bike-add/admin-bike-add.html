<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<div class="main">
    <meta charset="utf-8">
    <div *ngIf="isLoading" class="table-state-cell">
        Đang lưu xe mới...
    </div>

    <div *ngIf="!isLoading">
        <header class="main__header">
            <div class="header-left">
                <button (click)="goBack()" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">
                    <h1>Thêm xe mới</h1>
                    <span>Điền thông tin xe chi tiết bên dưới</span>
                </div>
            </div>
            <div class="actions">
                <button (click)="saveChanges()" class="btn-save">
                    <i class="fas fa-save"></i> Lưu xe
                </button>
            </div>
        </header>

        <div class="detail-layout">
            
            <div class="detail-col-main">
                <section class="card">
                    <h2>Thông tin cơ bản</h2>

                    <div class="form-grid-2">
                         <div class="form-group">
                            <label for="id">Mã xe (ID)</label>
                            <input type="text" id="id" 
                                [value]="newBike.id" 
                                class="form-control" 
                                [readonly]="true">
                        </div>
                        <div class="form-group">
                            <label for="vehicleName">Tên xe</label>
                            <input type="text" id="vehicleName" [(ngModel)]="newBike.vehicleName" class="form-control">
                        </div>
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="brand">Hãng xe</label>
                            <select id="brand" [(ngModel)]="newBike.brandId" class="form-control">
                                <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="model">Model</label>
                            <input type="text" id="model" [(ngModel)]="newBike.model" class="form-control">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="licensePlate">Biển số xe</label>
                            <input type="text" id="licensePlate" [(ngModel)]="newBike.licensePlate" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="vehicleType">Loại xe</label>
                            <select id="vehicleType" [(ngModel)]="newBike.vehicleType" class="form-control">
                                <option *ngFor="let type of vehicleTypes" [value]="type">{{ type }}</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Hình ảnh & Mô tả</h2>
                    <div class="form-group">
                        <label for="imageUrl">Đường dẫn ảnh</label>
                        <input type="text" id="imageUrl" [(ngModel)]="newBike.image" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="description">Mô tả</label>
                        <textarea id="description" [(ngModel)]="newBike.description" class="form-control" rows="6"></textarea>
                    </div>
                </section>
            </div>

            <div class="detail-col-side">
                <section class="card">
                    <h2>Trạng thái & Vị trí</h2>
                    <div class="form-group">
                        <label for="status">Trạng thái</label>
                        <select id="status" [(ngModel)]="newBike.availabilityStatus" class="form-control">
                            <option [ngValue]="true">Sẵn sàng</option>
                            <option [ngValue]="false">Đang cho thuê</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="location">Khu vực</label>
                        <select id="location" [(ngModel)]="newBike.location" class="form-control">
                             <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
                        </select>
                    </div>
                </section>

                <section class="card">
                    <h2>Giá & Thông số</h2>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="pricePerDay">Giá / ngày (VND)</label>
                            <input type="number" id="pricePerDay" [(ngModel)]="newBike.pricePerDay" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="pricePerHour">Giá / giờ (VND)</label>
                            <input type="number" id="pricePerHour" [(ngModel)]="newBike.pricePerHour" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="discount">Giảm giá (%)</label>
                        <input type="number" id="discount" [(ngModel)]="newBike.discount" class="form-control">
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="battery">Dung lượng pin</label>
                            <input type="text" id="battery" [(ngModel)]="newBike.batteryCapacity" class="form-control" placeholder="Ví dụ: 3.5 kWh">
                        </div>
                        <div class="form-group">
                            <label for="range">Quãng đường (KM)</label>
                            <input type="number" id="range" [(ngModel)]="newBike.rangePerCharge" class="form-control" placeholder="Ví dụ: 200">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Tags</h2>
                    <div class="form-group">
                        <label for="tags">Tags (cách nhau bằng dấu phẩy)</label>
                        <input type="text" id="tags" [(ngModel)]="newBike.tags" class="form-control" placeholder="eco, popular, city">
                    </div>
                </section>
            </div>

        </div>
    </div>

    <div class="popup-overlay" *ngIf="showConfirmPopup">
        <div class="popup-container">
            <h2>Xác nhận</h2>
            <p>Bạn có chắc chắn muốn tạo xe mới này?</p>
            <div class="popup-actions">
                <button (click)="onCancelSave()" class="btn-popup-cancel">Hủy</button>
                <button (click)="onConfirmSave()" class="btn-popup-confirm">Tạo</button>
            </div>
        </div>
    </div>

    <div class="popup-overlay" *ngIf="showSuccessPopup">
        <div class="popup-container">
            <h2>Thành công</h2>
            <p>Đã tạo xe mới thành công!</p>
            <div class="popup-actions">
                <button (click)="onCloseSuccessAndGoBack()" class="btn-popup-cancel">Về danh sách</button>
                <button (click)="onCloseSuccessAndReset()" class="btn-popup-confirm">Thêm xe mới</button>
            </div>
        </div>
    </div>

</div>
