<div class="main">
    <div *ngIf="isLoading" class="table-state-cell">
        Đang tải thông tin khách hàng...
    </div>

    <div *ngIf="!isLoading && !customer" class="table-state-cell">
        Không tìm thấy thông tin khách hàng.
        <br><br>
        <button (click)="goBack()" class="btn-back">Quay lại</button>
    </div>

    <div *ngIf="!isLoading && customer">
        <header class="main__header">
            <div class="header-left">
                <button (click)="goBack()" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">
                    <h1>{{ customer.hoTen }}</h1>
                    <span>ID: {{ customer.maKhachHang }}</span>
                </div>
            </div>
            <div class="actions">
                <button (click)="saveChanges()" class="btn-save">
                    <i class="fas fa-save"></i> Lưu thay đổi
                </button>
            </div>
        </header>

        <div class="detail-layout">
            
            <div class="detail-col-main">
                <section class="card">
                    <h2>Thông tin cá nhân</h2>
                    <div class="form-group">
                        <label for="hoTen">Họ và tên</label>
                        <input type="text" id="hoTen" [(ngModel)]="customer.hoTen" class="form-control">
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" [(ngModel)]="customer.email" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="soDienThoai">Số điện thoại</label>
                            <input type="text" id="soDienThoai" [(ngModel)]="customer.soDienThoai" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ngaySinh">Ngày sinh</label>
                        <input type="date" id="ngaySinh" [(ngModel)]="customer.ngaySinh" class="form-control">
                    </div>
                </section>

                <section class="card">
                    <h2>Địa chỉ</h2>
                    <div class="form-group">
                        <label for="soNhaDuong">Số nhà, Đường</label>
                        <input type="text" id="soNhaDuong" [(ngModel)]="customer.diaChi.soNhaDuong" class="form-control">
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="phuongXa">Phường/Xã</label>
                            <input type="text" id="phuongXa" [(ngModel)]="customer.diaChi.phuongXa" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="quanHuyen">Quận/Huyện</label>
                            <input type="text" id="quanHuyen" [(ngModel)]="customer.diaChi.quanHuyen" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="tinhThanh">Tỉnh/Thành phố</label>
                        <input type="text" id="tinhThanh" [(ngModel)]="customer.diaChi.tinhThanh" class="form-control">
                    </div>
                </section>
            </div>

            <div class="detail-col-side">
                <section class="card">
                    <h2>Thông tin tài khoản</h2>
                    <div class="form-group">
                        <label for="hangThanhVien">Hạng thành viên</label>
                        <select id="hangThanhVien" [(ngModel)]="customer.hangThanhVien" class="form-control">
                             <option *ngFor="let tier of memberTiers" [value]="tier">{{ tier }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ngayDangKy">Ngày đăng ký</label>
                        <input type="text" id="ngayDangKy" [value]="customer.ngayDangKy | date:'dd/MM/yyyy HH:mm'" class="form-control" readonly>
                    </div>
                </section>

                <section class="card">
                    <h2>Thông tin bằng lái</h2>
                    <div class="form-group">
                        <label for="soBangLai">Số bằng lái</label>
                        <input type="text" id="soBangLai" [(ngModel)]="customer.thongTinBangLai.soBangLai" class="form-control">
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="hangBangLai">Hạng bằng lái</label>
                            <input type="text" id="hangBangLai" [(ngModel)]="customer.thongTinBangLai.hangBangLai" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="ngayHetHan">Ngày hết hạn</label>
                            <input type="date" id="ngayHetHan" [(ngModel)]="customer.thongTinBangLai.ngayHetHan" class="form-control">
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div class="popup-overlay" *ngIf="showConfirmPopup">
        <div class="popup-container">
            <h2>Xác nhận</h2>
            <p>Bạn có chắc chắn muốn lưu các thay đổi này?</p>
            <div class="popup-actions">
                <button (click)="onCancelSave()" class="btn-popup-cancel">Hủy</button>
                <button (click)="onConfirmSave()" class="btn-popup-confirm">Lưu</button>
            </div>
        </div>
    </div>

    <div class="popup-overlay" *ngIf="showSuccessPopup">
        <div class="popup-container">
            <h2>Thành công</h2>
            <p>Đã lưu thay đổi thành công!</p>
            <div class="popup-actions">
                <button (click)="onCloseSuccessAndGoBack()" class="btn-popup-cancel">Quay về</button>            
                <button (click)="onCloseSuccessAndStay()" class="btn-popup-confirm">OK</button>
            </div>
        </div>
    </div>

</div>
