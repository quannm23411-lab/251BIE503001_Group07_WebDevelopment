<div class="admin">
    <aside class="sidebar">
        <div class="sidebar__logo">
            <img src="assets/logos/logo.png" alt="EcoMOVE Logo" />
            <h2>EcoMOVE</h2>
        </div>

        <ul class="sidebar__menu">
            <li>Dashboard</li>
            <li class="active">Quản lý xe</li>
            <li>Đơn thuê xe</li>
            <li>Khách hàng</li>
            <li>Marketing & Popup</li>
            <li>Giao diện website</li>
            <li>Tài khoản Admin</li>
            <li>Hệ thống & Nhật ký</li>
        </ul>
    </aside>

    <main class="main">
        <header class="main__header">
            <button class="btn-back" (click)="goBack()">← Quay lại</button>
            <h1>Chi tiết sản phẩm</h1>
            <div class="actions">
                <button class="btn-export">📦 Xuất danh sách</button>
                <button class="btn-edit">✏️ Chỉnh sửa</button>
                <button class="btn-delete">🗑️ Xóa</button>
                <button class="btn-hide">👁️ Ẩn</button>
            </div>
        </header>

        <section class="product-detail">
            <div class="product-images">
                <h2>{{ vehicleName }}</h2>
                <img [src]="mainImage" alt="Ảnh xe" class="main-img" />

                <div class="thumbs">
                    <img *ngFor="let t of thumbs" [src]="t" [class.active]="t === mainImage" (click)="changeImage(t)" />
                </div>
            </div>

            <div class="product-info">
                <h3>Thông tin cơ bản</h3>
                <form class="info-form">
                    <div class="form-group">
                        <label>Tên xe:</label>
                        <input type="text" [value]="name" readonly />
                    </div>

                    <div class="form-group">
                        <label>Mô tả:</label>
                        <textarea rows="4" [value]="description" readonly></textarea>
                    </div>

                    <div class="form-group">
                        <label>Biển số:</label>
                        <input type="text" [value]="licensePlate" readonly />
                    </div>

                    <div class="form-group">
                        <label>Thương hiệu:</label>
                        <input type="text" [value]="brand" readonly />
                    </div>

                    <div class="form-group">
                        <label>Loại xe:</label>
                        <div class="tag-group">
                            <span *ngFor="let type of typeList" class="tag" [class.active]="type === activeType">{{ type
                                }}</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Trạng thái:</label>
                        <div class="tag-group">
                            <span *ngFor="let st of statusList" class="tag" [class.active]="st === activeStatus">{{ st
                                }}</span>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
