<div class="main">
    <div *ngIf="isLoading" class="table-state-cell">
        Đang tải thông tin xe...
    </div>

    <div *ngIf="!isLoading && !bike" class="table-state-cell">
        Không tìm thấy thông tin xe.
        <br><br>
        <button (click)="goBack()" class="btn-back">Quay lại</button>
    </div>

    <div *ngIf="!isLoading && bike">
        <header class="main__header">
            <div class="header-left">
                <button (click)="goBack()" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">
                    <h1>{{ bike.vehicleName }}</h1>
                    <span>ID: {{ bike.id }}</span>
                </div>
            </div>
            <div class="actions">
                <button (click)="saveChanges()" class="btn-save">
                    <i class="fas fa-save"></i> Lưu thay đổi
                </button>
            </div>
        </header>

        <div class="detail-layout">
            
            <div class="detail-col-main">
                <section class="card">
                    <h2>Thông tin cơ bản</h2>
                    <div class="form-group">
                        <label for="vehicleName">Tên xe</label>
                        <input type="text" id="vehicleName" [(ngModel)]="bike.vehicleName" class="form-control">
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="brand">Hãng xe</label>
                            <select id="brand" [(ngModel)]="bike.brandId" class="form-control">
                                <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="model">Model</label>
                            <input type="text" id="model" [(ngModel)]="bike.model" class="form-control">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="licensePlate">Biển số xe</label>
                            <input type="text" id="licensePlate" [(ngModel)]="bike.licensePlate" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="vehicleType">Loại xe</label>
                            <select id="vehicleType" [(ngModel)]="bike.vehicleType" class="form-control">
                                <option *ngFor="let type of vehicleTypes" [value]="type">{{ type }}</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Hình ảnh</h2>
                    <img [src]="bike.image" alt="{{ bike.vehicleName }}" class="detail-image">
                    <div class="form-group">
                        <label for="imageUrl">Đường dẫn ảnh</label>
                        <input type="text" id="imageUrl" [(ngModel)]="bike.image" class="form-control">
                    </div>
                </section>
                
                <section class="card">
                    <h2>Chi tiết Mô tả & Tính năng</h2>

                    <div class="form-group">
                        <label for="description">Mô tả ngắn (Tóm tắt)</label>
                        <textarea id="description" [(ngModel)]="bike.description" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="detailTitle">Tiêu đề chi tiết</label>
                        <input type="text" id="detailTitle" [(ngModel)]="bike.details.title" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="detailParagraphs">Các đoạn mô tả (Mỗi đoạn 1 dòng)</label>
                        <textarea id="detailParagraphs" 
                                  [ngModel]="bike.details.paragraphs.join('\n')"
                                  (ngModelChange)="bike.details.paragraphs = $event.split('\n')"
                                  class="form-control" rows="6"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="detailFeatures">Tính năng nổi bật (Mỗi tính năng 1 dòng)</label>
                        <textarea id="detailFeatures" 
                                  [ngModel]="bike.details.features.join('\n')"
                                  (ngModelChange)="bike.details.features = $event.split('\n')"
                                  class="form-control" rows="6"></textarea>
                    </div>
                </section>

            </div>

            <div class="detail-col-side">
                <section class="card">
                    <h2>Trạng thái & Vị trí</h2>
                    <div class="form-group">
                        <label for="status">Trạng thái</label>
                        <select id="status" [(ngModel)]="bike.availabilityStatus" class="form-control">
                            <option [ngValue]="true">Sẵn sàng</option>
                            <option [ngValue]="false">Đang cho thuê</option>
                            <option [ngValue]="false">Bảo trì</option>
                            <option [ngValue]="false">Ngừng kinh doanh</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="location">Khu vực</label>
                        <select id="location" [(ngModel)]="bike.location" class="form-control">
                             <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tags">Tags (phân cách bằng dấu phẩy)</label>
                        <input type="text" id="tags" 
                            [ngModel]="bike.tags.join(', ')" 
                            (ngModelChange)="onTagsChange($event)" 
                            class="form-control"
                            placeholder="VD: eco, popular, city">
                    </div>

                </section>

                <section class="card">
                    <h2>Giá & Thông số</h2>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="pricePerDay">Giá / ngày (VND)</label>
                            <input type="number" id="pricePerDay" [(ngModel)]="bike.pricePerDay" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="pricePerHour">Giá / giờ (VND)</label>
                            <input type="number" id="pricePerHour" [(ngModel)]="bike.pricePerHour" class="form-control">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="discount">Giảm giá (%)</label>
                            <input type="number" id="discount" [(ngModel)]="bike.discount" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="rating">Đánh giá (sao)</label>
                            <input type="number" id="rating" [(ngModel)]="bike.rating" class="form-control" step="0.1">
                        </div>
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="battery">Dung lượng pin (kWh)</label>
                            <input type="text" id="battery" [(ngModel)]="bike.batteryCapacity" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="range">Quãng đường (KM)</label>
                            <input type="number" id="range" [(ngModel)]="bike.rangePerCharge" class="form-control">
                        </div>
                    </div>
                </section>

                </div>

        </div>
    </div>

    <div class="popup-overlay" *ngIf="showConfirmPopup">
        <div class="popup-container">
            <h2>Xác nhận</h2>
            <p>Bạn có chắc chắn muốn lưu các thay đổi này?</p>
            <div class="popup-actions">
                <button (click)="onCancelSave()" class="btn-popup-cancel">Hủy</button>
                <button (click)="onConfirmSave()" class="btn-popup-confirm">Lưu</button>
            </div>
        </div>
    </div>

    <div class="popup-overlay" *ngIf="showSuccessPopup">
        <div class="popup-container">
            <h2>Thành công</h2>
            <p>Đã lưu thay đổi thành công!</p>
            <div class="popup-actions">
                <button (click)="onCloseSuccessAndGoBack()" class="btn-popup-cancel">Quay về</button>
                <button (click)="onCloseSuccessAndStay()" class="btn-popup-confirm">OK</button>
            </div>
        </div>
    </div>

</div>
