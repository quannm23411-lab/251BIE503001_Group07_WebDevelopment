<div class="main">
    <header class="main__header">
        <h1>Quản lý xe</h1>
        <div class="actions">
            <button class="btn-export">📦 Xuất danh sách</button>
            <button class="btn-add">+ Thêm sản phẩm</button>
        </div>
    </header>

    <section class="filters">
        <input type="text" placeholder="Nhập tên xe hoặc mã xe" [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" />
        <select [(ngModel)]="brandFilter" (ngModelChange)="applyFilter()">
            <option value="">Hãng xe</option>
            <option *ngFor="let b of brands" [value]="b">{{ b }}</option>
        </select>
        <select [(ngModel)]="statusFilter" (ngModelChange)="applyFilter()">
            <option value="">Trạng thái</option>
            <option>Sẵn sàng</option>
            <option>Đang cho thuê</option>
        </select>
        <select [(ngModel)]="priceFilter" (ngModelChange)="applyFilter()">
            <option value="">Giá thuê</option>
            <option value="<100000">Dưới 100.000đ</option>
            <option value="100000-150000">100.000 - 150.000đ</option>
            <option value=">150000">Trên 150.000đ</option>
        </select>
        <select [(ngModel)]="locationFilter" (ngModelChange)="applyFilter()">
            <option value="">Khu vực</option>
            <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
        </select>
        <button class="btn-reset" (click)="resetFilters()">Đặt lại</button>
    </section>

<section class="bike-list">
    <table>
        <thead>
            <tr>
                <th class="sortable" (click)="onSort('name')" [class.sort-active]="sortColumn === 'name'">
                    <div class="th-content">
                        <span>Tên xe / Mã xe</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'name' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'name' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                <th class="sortable" (click)="onSort('price')" [class.sort-active]="sortColumn === 'price'">
                    <div class="th-content">
                        <span>Giá thuê (ngày)</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'price' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'price' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                <th class="sortable" (click)="onSort('battery')" [class.sort-active]="sortColumn === 'battery'">
                    <div class="th-content">
                        <span>Dung lượng pin</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'battery' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'battery' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                <th class="sortable" (click)="onSort('range')" [class.sort-active]="sortColumn === 'range'">
                    <div class="th-content">
                        <span>Quãng đường/lần sạc</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'range' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'range' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                <th class="sortable" (click)="onSort('status')" [class.sort-active]="sortColumn === 'status'">
                    <div class="th-content">
                        <span>Trạng thái</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'status' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'status' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                <th class="sortable" (click)="onSort('location')" [class.sort-active]="sortColumn === 'location'">
                    <div class="th-content">
                        <span>Khu vực</span>
                        <i class="fas fa-sort" 
                           [class.fa-sort-up]="sortColumn === 'location' && sortDirection === 'asc'"
                           [class.fa-sort-down]="sortColumn === 'location' && sortDirection === 'desc'">
                        </i>
                    </div>
                </th>
                </tr>
        </thead>

        <tbody>
            <tr *ngIf="isLoading">
                <td colspan="6" class="table-state-cell">
                    Đang tải danh sách xe...
                </td>
            </tr>
            <tr *ngFor="let bike of filtered" class="clickable-row" (click)="goToDetail(bike)">
                <td>
                    <div class="bike-info">
                        <img [src]="bike.image" alt="{{ bike.name }}">
                        <div>
                            <strong>{{ bike.name }}</strong>
                            <br>
                             <span>{{ bike.id }}</span>
                        </div>
                    </div>
                </td>
                <td>{{ bike.price | number }}đ</td>
                <td>{{ bike.battery }}</td>
                <td>{{ bike.range }}</td>
                <td>
                    <span class="status" [class]="bike.statusClass">{{ bike.status }}</span>
                </td>
                <td>{{ bike.location }}</td>
                </tr>

            <tr *ngIf="!isLoading && filtered.length === 0">
                 <td colspan="6" class="table-state-cell">
                    Không tìm thấy xe nào khớp với bộ lọc.
                </td>
            </tr>
        </tbody>
    </table>
</section>
</div>
