<header class="header" id="mainHeader">
  <div class="header__ads">
    <marquee behavior="scroll" direction="left" scrollamount="4">
      🌿 Miễn phí giao/nhận xe tại 30+ điểm trong thành phố • Hỗ trợ kỹ thuật
      24/7 • Ưu đãi đến 10% tuần đầu thuê 🌿
    </marquee>
  </div>

  <div class="header__middle">
    <div class="header__logo">
      <img src="assets/logos/logo.png" alt="EcoMOVE Logo" />
      <span class="header__logo-text">EcoMOVE</span>
    </div>

    <form class="header__search">
      <input type="text" placeholder="Bạn muốn thuê gì hôm nay?" class="header__search-input" />
      <button type="submit" class="header__search-btn">
        <img src="assets/icons/search.png" alt="Tìm kiếm" />
      </button>
    </form>

    <div class="header__actions">
      <a routerLink="/cart" class="nav__cart">
        <img src="assets/icons/cart.png" alt="Cart" />
        <span class="cart-badge">1</span>
      </a>
      <a routerLink="/login" class="nav__login-btn">
        <img src="assets/icons/user.png" alt="User" />
        Đăng nhập
      </a>
    </div>
  </div>

  <nav class="nav" id="mainNav">
    <ul class="nav__menu">
      <li>
        <a class="nav__link" 
           routerLink="/" 
           routerLinkActive="nav__link--active" 
           [routerLinkActiveOptions]="{exact: true}">
           TRANG CHỦ
        </a>
      </li>
      <li class="nav__item nav__rent">
        <a class="nav__link" routerLink="/rent" routerLinkActive="nav__link--active">ĐẶT XE</a>
        <div class="rent-dropdown">
           </div>
      </li>
      <li><a class="nav__link" routerLink="/blog" routerLinkActive="nav__link--active">BLOG</a></li>
      <li><a class="nav__link" routerLink="/about" routerLinkActive="nav__link--active">VỀ CHÚNG TÔI</a></li>
    </ul>
  </nav>
</header>
